<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Parsec Switcher</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">

    <!-- Header -->
    <header class="app-header">
      <div class="header-meta">
        <div>
          <h1 class="app-title">
            <span class="icon-glow"><i class="fa-solid fa-shuffle"></i></span>
            Parsec Switcher
          </h1>
          <p class="app-subtitle">Gerencie suas contas Parsec em um clique</p>
        </div>
        <span class="version-badge" id="parsec_version"></span>
      </div>
    </header>

    <!-- Accounts -->
    <section class="accounts-section">
      <div class="section-label">Suas Contas</div>
      <div id="accounts-container" class="accounts-grid"></div>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <button class="add-account-btn" id="add-account-btn">
        <i class="fa-solid fa-user-plus"></i>
        Adicionar Conta
      </button>
    </footer>

  </div>

  <!-- Popup Container -->
  <div id="popup-div"></div>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <span class="loading-text">PROCESSANDO</span>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="utils.js"></script>
  <script src="template.js"></script>
  <script src="elements.js"></script>
  <script src="control.js"></script>
</body>
</html>
