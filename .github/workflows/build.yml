name: Build/release

# Builds on pushes to main, pull requests and manual runs. A `v*` tag push also
# publishes the DMG as a GitHub Release (see the `release` job at the bottom).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the `release` job below gets write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Front-end checks
        run: node --test tests/*.test.mjs

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked

      - name: Build Tauri app
        run: cargo tauri build

      - name: Keep the DMG as a build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ParsecSwitcher-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    # Only for `v*` tags. This is the only job with a write token, and it runs no project code.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ParsecSwitcher-dmg
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.dmg
